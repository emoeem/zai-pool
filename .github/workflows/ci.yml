name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 编译检查（三脚本可编译）
        run: |
          python -m py_compile zai-pool.py zacc.py zacc-web.py
      - name: 静态检查（仅错误级，不做风格门禁）
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82,F401 --extend-ignore F401 zai-pool.py zacc.py zacc-web.py tests/
      - name: 测试（全部 mock 上游，零真实凭据）
        run: |
          pip install pytest
          python -m pytest tests/ -q
        env:
          ZPOOL_TEST: "1"
      - name: 生产验收套件（10 场景 + 重启恢复，mock 上游）
        run: |
          python tests/acceptance.py
